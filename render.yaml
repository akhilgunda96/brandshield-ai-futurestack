services:
  - type: web
    name: brandshield-grumpybot
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python launch.py
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.13
      - key: BRANDSHIELD_DEMO_MODE
        value: "true"
      - key: BRANDSHIELD_DB
        value: data/brandshield.sqlite3
